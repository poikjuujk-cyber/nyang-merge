<meta charset="utf-8">
<title>냥냥 머지</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  /* 레이아웃: 한 화면 세로 게임 — 상단 점수 / 가운데 상자(캔버스) / 하단 다음·컨트롤·도감띠 */
  :root{
    --bg:#fbf3e6; --panel:#fff8ec; --fg:#4a3326; --muted:#a58b6f;
    --accent:#ef7d57; --accent-2:#f4b942; --line:#ead6b6; --shadow:rgba(120,80,40,.18);
    --font-display:'Jua', system-ui, sans-serif;
    --font-body:system-ui,-apple-system,'Segoe UI',sans-serif;
    /* 놀이판 비율 — 폰에서 판을 세로로 늘릴 때 JS가 함께 갱신한다 */
    --ar: 400 / 560;
    --arw: 0.714286;   /* = 400/560, 세로 공간에서 가로 폭을 구할 때 쓰는 계수 */
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#241c15; --panel:#302519; --fg:#f2e7d6; --muted:#b39c82;
    --accent:#ef7d57; --accent-2:#f4b942; --line:#473726; --shadow:rgba(0,0,0,.35);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#241c15; --panel:#302519; --fg:#f2e7d6; --muted:#b39c82;
    --accent:#ef7d57; --accent-2:#f4b942; --line:#473726; --shadow:rgba(0,0,0,.35);
    color-scheme:dark;
  }
  html{ -webkit-text-size-adjust:100%; }
  html,body{height:100%;}
  [hidden]{ display:none !important; }
  body{
    margin:0; background:var(--bg); color:var(--fg); font-family:var(--font-body);
    display:flex; flex-direction:column; align-items:center; overflow:hidden;
    -webkit-user-select:none; user-select:none; touch-action:manipulation;
    overscroll-behavior:none; -webkit-tap-highlight-color:transparent;
  }
  button, canvas{ -webkit-tap-highlight-color:transparent; }
  .wrap{
    width:100%; max-width:680px; height:100%;
    padding-left:max(14px, env(safe-area-inset-left,0px));
    padding-right:max(14px, env(safe-area-inset-right,0px));
    padding-top:max(10px, env(safe-area-inset-top,0px));
    padding-bottom:max(10px, env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; align-items:center; gap:10px; box-sizing:border-box;
  }
  .top{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{ font-family:var(--font-display); font-size:1.5rem; letter-spacing:.5px; color:var(--fg); line-height:1;}
  .brand small{ display:block; font-family:var(--font-body); font-size:.62rem; font-weight:600; color:var(--muted); letter-spacing:2px; margin-top:3px;}
  .scores{ display:flex; gap:8px; }
  .score-card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:7px 13px; text-align:right; box-shadow:0 2px 0 var(--shadow); min-width:74px;}
  .score-card .lbl{ font-size:.58rem; font-weight:700; letter-spacing:1.5px; color:var(--muted);}
  .score-card .val{ font-family:var(--font-display); font-size:1.4rem; line-height:1.05; font-variant-numeric:tabular-nums; color:var(--fg);}
  .score-card.best .val{ color:var(--accent-2);}

  .stage{ position:relative; display:flex; justify-content:center; width:100%; flex:0 1 auto;}
  .board{ position:relative; width:min(100%, calc((100vh - 298px) * var(--arw)), 586px); aspect-ratio:var(--ar); height:auto;
          border-radius:20px; overflow:hidden; box-shadow:0 10px 26px var(--shadow), inset 0 0 0 2px rgba(255,255,255,.04);}
  canvas#game{ display:block; width:100%; height:100%; cursor:pointer; touch-action:none;}

  .over{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
         background:rgba(30,20,12,.62); color:#fff8ec; border-radius:20px; backdrop-filter:blur(3px); text-align:center; padding:20px;}
  .over h2{ font-family:var(--font-display); font-size:2rem; margin:0; }
  .over .fin{ font-size:1rem; opacity:.95;}
  .over .fin b{ font-family:var(--font-display); font-size:1.7rem; color:var(--accent-2); display:block; margin-top:2px;}
  .over .reg{ display:flex; gap:8px; width:min(320px,90%);}
  .over .reg input{ flex:1; min-width:0; font:inherit; padding:10px 12px; border:1px solid var(--line);
    border-radius:12px; background:rgba(255,248,236,.96); color:#4a3326;}
  .over .reg button{ flex:0 0 auto; white-space:nowrap;}
  .over .regmsg{ font-size:.85rem; min-height:1.25em; color:var(--accent-2); font-weight:700;}
  .over .regmsg.bad{ color:#ffd0c4;}

  .controls{ width:100%; display:flex; align-items:center; gap:10px;}
  .next{ display:flex; align-items:center; gap:9px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:6px 10px 6px 8px; box-shadow:0 2px 0 var(--shadow);}
  .next .lbl{ font-size:.58rem; font-weight:700; letter-spacing:1.5px; color:var(--muted);}
  .next canvas{ width:42px; height:42px; display:block;}
  .next .nm{ font-family:var(--font-display); font-size:.95rem; color:var(--fg); min-width:44px;}
  .spacer{ flex:1;}
  button.btn{ font-family:var(--font-display); font-size:1rem; color:#fff; background:var(--accent); border:none; border-radius:14px; padding:10px 16px; box-shadow:0 3px 0 #c75a38; cursor:pointer;}
  button.btn:active{ transform:translateY(2px); box-shadow:0 1px 0 #c75a38;}
  button.icon{ width:44px; height:44px; padding:0; font-size:1.25rem; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:14px; box-shadow:0 2px 0 var(--shadow); cursor:pointer; display:flex; align-items:center; justify-content:center;}
  button:focus-visible, canvas:focus-visible{ outline:3px solid var(--accent-2); outline-offset:2px;}

  .chain{ width:100%; box-sizing:border-box; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:7px 10px; box-shadow:0 2px 0 var(--shadow);}
  .chain .hd{ font-size:.58rem; font-weight:700; letter-spacing:1.5px; color:var(--muted); margin-bottom:4px;}
  .chain .row{ display:flex; align-items:center; gap:2px; overflow-x:auto; scrollbar-width:thin;}
  .chain .cell{ position:relative; flex:0 0 auto; display:flex; align-items:center;}
  .chain canvas{ width:30px; height:30px; display:block;}
  .chain .cell.goal canvas{ width:38px; height:38px;}
  .chain .arr{ color:var(--line); font-size:.7rem; flex:0 0 auto;}
  .hint{ font-size:.66rem; color:var(--muted); text-align:center; width:100%;}
  @media (max-height:720px){ .chain .hd{display:none} .chain{padding:5px 8px} .board{width:min(100%, calc((100vh - 276px) * var(--arw)), 586px)} }

  /* 아이템 버튼 */
  .items{ display:flex; gap:6px;}
  button.item{ position:relative; width:44px; height:44px; padding:0; font-size:1.15rem; background:var(--panel); color:var(--fg);
    border:1px solid var(--line); border-radius:14px; box-shadow:0 2px 0 var(--shadow); cursor:pointer;
    display:flex; align-items:center; justify-content:center;}
  button.item:disabled{ opacity:.38; cursor:default;}
  button.item.active{ outline:3px solid var(--accent); background:#ffe9db;}
  :root[data-theme="dark"] button.item.active{ background:#4a3322;}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) button.item.active{ background:#4a3322;} }
  button.item .cnt{ position:absolute; top:-6px; right:-6px; min-width:18px; height:18px; border-radius:9px;
    background:var(--accent); color:#fff; font-size:.68rem; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0 4px;}

  /* 피버 게이지 + 작은 버튼 줄 */
  .subrow{ width:100%; display:flex; gap:8px; align-items:center;}
  .feverbar{ position:relative; flex:1; min-width:0; height:18px; background:var(--panel); border:1px solid var(--line); border-radius:9px; overflow:hidden; box-shadow:0 2px 0 var(--shadow);}
  .fv-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:linear-gradient(90deg,#f4b942,#ef7d57); transition:width .25s;}
  .feverbar.hot .fv-fill{ background:linear-gradient(90deg,#ff8a5c,#ff5050);}
  .fv-txt{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:.6rem; font-weight:700; letter-spacing:.5px; color:var(--fg);}
  .minis{ display:flex; gap:5px; flex:0 0 auto;}
  .minis button.icon{ width:40px; height:40px; font-size:1.1rem;}
  button.icon.off{ opacity:.42;}
  @media (max-width:420px){ .next .nm{display:none;} .controls{gap:8px;} button.btn{padding:10px 12px;} }

  /* 좁은 화면: side는 투명 래퍼(자식들이 wrap에 직접 배치) — order로 세로 순서 유지 */
  .side{ display:contents; }
  .top{ order:0;} .stage{order:1;} .subrow{order:2;} .controls{order:3;} .chain{order:4;} .hint{order:5;}

  /* 넓은 화면: 보드(좌) + UI 사이드바(우) 2단 배치, 보드가 화면 높이를 꽉 채움 */
  @media (min-width:760px){
    /* 빈칸 · 판 · 사이드바 — 양쪽 칸을 강제로 같은 너비로 둬서 게임판이 늘 화면 정중앙 */
    .wrap{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
           align-items:center; max-width:none; gap:22px;}
    .stage{ grid-column:2; grid-row:1; order:0; width:auto;}
    .side{ grid-column:3; grid-row:1; order:1; display:flex; flex-direction:column; gap:10px;
           width:100%; max-width:340px; min-width:0; justify-self:start;}
    .board{ width:min(calc((100vh - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * var(--arw)), calc(100vw - 430px), 700px); }
    .side .top{ flex-wrap:wrap; row-gap:6px;}
    .side .controls{ flex-wrap:wrap; row-gap:8px;}
    .chain .hd{ display:block; }
  }
  @media (min-width:760px) and (max-width:1200px){ .side .next .nm{ display:none; } }

  /* 세로 폰: UI를 바짝 줄이고 남는 세로 공간을 전부 게임판에 준다 */
  @media (max-width:759px){
    html,body{ height:100dvh; }
    .wrap{ height:100dvh;
           padding-left:max(4px, env(safe-area-inset-left,0px));
           padding-right:max(4px, env(safe-area-inset-right,0px));
           padding-top:max(6px, env(safe-area-inset-top,0px));
           padding-bottom:max(6px, env(safe-area-inset-bottom,0px));
           gap:6px;}
    .stage{ flex:1 1 auto; min-height:0; width:100%;}
    /* JS가 인라인 px로 정확히 덮어쓴다. 아래 값은 JS가 못 돌 때도 비율이 깨지지 않게 하는 안전망 */
    .board{ width:auto; height:100%; max-width:100%; max-height:100%; aspect-ratio:var(--ar); border-radius:16px;}
    .hint.idle{ display:none;}            /* 아이템 안내가 필요할 때만 보여줌 */
    .chain .hd{ display:none;}
    .chain{ padding:4px 6px;}
    .chain canvas{ width:26px; height:26px;}
    .chain .cell.goal canvas{ width:32px; height:32px;}
    .brand{ font-size:1.2rem;}
    .brand small{ display:none;}
    .score-card{ padding:4px 10px; min-width:64px;}
    .score-card .val{ font-size:1.2rem;}
    .controls{ gap:6px;}
    button.icon, button.item{ width:40px; height:40px;}
    .minis button.icon{ width:38px; height:38px;}
    .next canvas{ width:36px; height:36px;}
    .next{ padding:4px 8px 4px 6px;}
  }

  /* 랭킹 오버레이 */
  .rankwrap{ position:fixed; inset:0; background:rgba(25,16,9,.55); display:flex; align-items:center; justify-content:center; z-index:30;
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
    padding-top:max(16px, env(safe-area-inset-top,0px));
    padding-bottom:max(16px, env(safe-area-inset-bottom,0px)); }
  .rankcard{ width:min(92vw,360px); max-height:80vh; overflow:auto; background:var(--panel); color:var(--fg);
    border:1px solid var(--line); border-radius:18px; padding:16px; box-shadow:0 14px 34px rgba(0,0,0,.35);}
  .rankcard h3{ font-family:var(--font-display); margin:0 0 10px; font-size:1.25rem;}
  .rk-me{ display:flex; gap:8px; align-items:center; margin-bottom:10px;}
  .rk-me input{ flex:1; min-width:0; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg);}
  .rk-me .mybest{ font-family:var(--font-display); color:var(--accent-2); font-size:1.05rem; white-space:nowrap;}
  ol.rk{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px;}
  ol.rk li{ display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:10px; background:var(--bg); border:1px solid var(--line);}
  ol.rk li .no{ font-family:var(--font-display); width:26px; text-align:center; color:var(--muted);}
  ol.rk li:nth-child(1) .no{ color:#e7a100;}
  ol.rk li:nth-child(2) .no{ color:#8f9aa6;}
  ol.rk li:nth-child(3) .no{ color:#c07a4b;}
  ol.rk li .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  ol.rk li .sc{ font-variant-numeric:tabular-nums; font-weight:700;}
  ol.rk li.me{ outline:2px solid var(--accent);}
  /* 괴도 냥이 아이템 선택 */
  .pickcard{ text-align:center; width:min(94vw,380px);}
  .pickcard h3{ margin:2px 0 4px;}
  .pick-note{ font-size:.8rem; color:var(--muted); margin:0 0 12px; line-height:1.5;}
  #phantomCv{ display:block; width:200px; height:150px; margin:0 auto;}
  .pick-row{ display:flex; flex-direction:column; gap:8px;}
  button.pick-item{ display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:var(--bg); color:var(--fg); border:2px solid var(--line); border-radius:14px;
    padding:10px 12px; cursor:pointer; font:inherit; opacity:0;
    animation:pickIn .42s cubic-bezier(.2,1.4,.5,1) forwards;}
  button.pick-item:hover, button.pick-item:focus-visible{ border-color:var(--accent); background:#ffeadf;}
  :root[data-theme="dark"] button.pick-item:hover{ background:#4a3322;}
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) button.pick-item:hover{ background:#4a3322;} }
  button.pick-item:active{ transform:scale(.97);}
  button.pick-item .ic{ font-size:1.5rem; flex:0 0 auto; width:34px; text-align:center;}
  button.pick-item .nm{ font-family:var(--font-display); font-size:1.05rem; flex:0 0 52px;}
  button.pick-item .ds{ font-size:.76rem; color:var(--muted); flex:1; min-width:0;}
  /* 괴도냥이가 아래에서 솟아오르며 등장 */
  #pickWrap.in #phantomCv{ animation:phantomIn .72s cubic-bezier(.15,1.5,.4,1) both;}
  #pickWrap.in .pickcard{ animation:cardPop .38s cubic-bezier(.2,1.5,.5,1) both;}
  @keyframes phantomIn{
    0%{ transform:translateY(96px) scale(.55) rotate(-16deg); opacity:0;}
    60%{ transform:translateY(-10px) scale(1.08) rotate(5deg); opacity:1;}
    100%{ transform:translateY(0) scale(1) rotate(0);} }
  @keyframes cardPop{ 0%{ transform:scale(.82); opacity:0;} 100%{ transform:scale(1); opacity:1;} }
  @keyframes pickIn{ 0%{ transform:translateY(16px); opacity:0;} 100%{ transform:translateY(0); opacity:1;} }
  @media (prefers-reduced-motion:reduce){
    #pickWrap.in #phantomCv, #pickWrap.in .pickcard, button.pick-item{ animation-duration:.01s;}
  }
  .rk-status{ font-size:.78rem; color:var(--muted); margin:8px 0 0; text-align:center;}
  .rk-close{ margin-top:12px; width:100%;}

</style>

<div class="wrap">
  <div class="stage">
    <div class="board">
      <canvas id="game" tabindex="0" aria-label="고양이 머지 게임판"></canvas>
      <div class="over" id="over" hidden>
        <h2>😿 꽉 찼어요!</h2>
        <div class="fin">이번 점수<b id="finScore">0</b></div>
        <div class="reg" id="regBox">
          <input id="overNick" maxlength="12" placeholder="이름을 입력하세요" aria-label="랭킹에 등록할 이름">
          <button class="btn" id="regBtn">🏆 등록</button>
        </div>
        <div class="regmsg" id="regMsg"></div>
        <button class="btn" id="retry">🐾 다시하기</button>
      </div>
    </div>
  </div>

  <div class="side">
  <div class="top">
    <div class="brand">냥냥 머지<small>CAT · 고등어까지</small></div>
    <div class="scores">
      <div class="score-card"><div class="lbl">점수</div><div class="val" id="score">0</div></div>
      <div class="score-card best"><div class="lbl">최고</div><div class="val" id="best">0</div></div>
    </div>
  </div>

  <div class="subrow">
    <div class="feverbar" id="feverBar" aria-label="피버 게이지"><div class="fv-fill" id="fvFill"></div><span class="fv-txt" id="fvTxt">피버 게이지 0 / 10</span></div>
    <div class="minis">
      <button class="icon" id="rankBtn" title="랭킹" aria-label="랭킹 보기">🏆</button>
      <button class="icon" id="bgm" title="배경음악 켜기/끄기" aria-label="배경음악 켜기 끄기">🎵</button>
      <button class="icon" id="mute" title="효과음 켜기/끄기" aria-label="효과음 켜기 끄기">🔊</button>
    </div>
  </div>

  <div class="controls">
    <div class="next">
      <div class="lbl">다음</div>
      <canvas id="nextCv" width="42" height="42"></canvas>
      <div class="nm" id="nextNm">—</div>
    </div>
    <div class="items">
      <button class="item" id="it-remove" title="제거: 고양이 하나를 없애요" aria-label="제거 아이템">🧹<span class="cnt" id="c-remove">0</span></button>
      <button class="item" id="it-swap" title="교환: 두 고양이 자리를 바꿔요" aria-label="교환 아이템">🔄<span class="cnt" id="c-swap">0</span></button>
      <button class="item" id="it-promote" title="승급: 고양이를 한 단계 올려요" aria-label="승급 아이템">⭐<span class="cnt" id="c-promote">0</span></button>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="restart">다시</button>
  </div>

  <div class="chain">
    <div class="hd">합치는 순서 — 👑고등어가 최고봉</div>
    <div class="row" id="chainRow"></div>
  </div>
  <div class="hint" id="hint">탭/클릭한 자리로 고양이가 떨어져요. 같은 고양이끼리 닿으면 합쳐집니다.</div>
  <!-- 아이템은 👑고등어 둘을 합쳐 터뜨렸을 때 괴도 냥이가 준다 -->
  </div>
</div>

<div class="rankwrap" id="rankWrap" hidden>
  <div class="rankcard">
    <h3>🏆 랭킹 TOP 10</h3>
    <div class="rk-me">
      <input id="nick" maxlength="12" placeholder="닉네임" aria-label="닉네임">
      <div class="mybest">내 최고 <span id="rkMyBest">0</span> · <span id="rkMyRank">—</span></div>
    </div>
    <ol class="rk" id="rkList"></ol>
    <div class="rk-status" id="rkStatus">불러오는 중…</div>
    <button class="btn rk-close" id="rankClose">닫기</button>
  </div>
</div>

<div class="rankwrap" id="pickWrap" hidden>
  <div class="rankcard pickcard">
    <canvas id="phantomCv" width="400" height="300" aria-hidden="true"></canvas>
    <h3>🎩 괴도 냥이 등장!</h3>
    <p class="pick-note">고등어를 터뜨린 솜씨, 훌륭하군.<br>하나만 골라 가게 — 선물이다냥.</p>
    <div class="pick-row" id="pickRow"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(function(){
  "use strict";
  var M = window.Matter;
  var Engine=M.Engine, Bodies=M.Bodies, Composite=M.Composite, Events=M.Events, Body=M.Body;

  // ---- 고양이 종류(합치는 순서, 작은→큰). 모두 오리지널 디자인 ----
  var TIERS = [
    {name:'아깽이', r:16,  base:'#f4e3c6', ear:'#f4e3c6', inner:'#f6b9bf', pat:'none'},

  // ---- 캔버스 / 반응형 ----
  var cv=document.getElementById('game'), ctx=cv.getContext('2d');

  function wantFill(){ return window.innerWidth < 760; }

  // 판 비율을 CSS에도 알려 준다 — 넓은 화면에서 CSS가 판 크기를 정할 때 같은 비율을 쓰도록
  function syncAR(){
    var s=document.documentElement.style;

  }

  // 놀이판 높이(H)를 지금 화면에 맞춰 계산한다(560~900). 넓은 화면은 기본 560.
  function wantedH(){
    if(!stageEl || !wantFill()) return 560;

  function layoutBoard(){
    if(!stageEl || !boardEl) return;
    if(!wantFill()){
      if(boardEl.style.width){ boardEl.style.width=''; boardEl.style.height=''; }
      return;
    }
    var r=stageEl.getBoundingClientRect();
    if(r.width<40 || r.height<40) return;
    var k=Math.min(r.width/W, r.height/H);
    var nw=Math.floor(W*k)+'px', nh=Math.floor(H*k)+'px';

  function resize(){

  // ---- 괴도 냥이: 고등어를 터뜨린 보상으로 아이템 3택을 내민다 ----
  var phCv=document.getElementById('phantomCv'), phCtx=phCv?phCv.getContext('2d'):null;
  var phT=0, phRaf=0, phOpen=false;
  function drawPhantom(c, cx, cy, r, t){
    var sway=Math.sin(t*2.1), bob=Math.sin(t*1.6)*r*0.05;
    c.save(); c.translate(cx, cy+bob);
    // 망토 (얼굴 뒤에서 펄럭)
    c.save();
    c.fillStyle='#b4243a'; c.strokeStyle='#7d1527'; c.lineWidth=Math.max(1.5,r*0.045);
    c.beginPath();
    c.moveTo(-r*0.92,-r*0.15);
    c.quadraticCurveTo(-r*(1.9+sway*0.18), r*0.95, -r*0.42, r*1.58);
    c.lineTo(r*0.42, r*1.58);
    c.quadraticCurveTo(r*(1.9-sway*0.18), r*0.95, r*0.92,-r*0.15);
    c.closePath(); c.fill(); c.stroke();
    c.restore();
    // 얼굴 — 턱시도 냥이
    drawCat(c, 0, 0, r, 5, 0);
    // 눈가리개
    c.fillStyle='#15151c';
    c.beginPath();
    c.moveTo(-r*0.84,-r*0.26); c.lineTo(r*0.84,-r*0.26);
    c.lineTo(r*0.74, r*0.12);  c.lineTo(-r*0.74, r*0.12);
    c.closePath(); c.fill();
    // 눈가리개 위로 또렷한 금색 눈
    for(var sgn=-1; sgn<=1; sgn+=2){
      c.fillStyle='#f6c74e'; c.beginPath(); c.arc(sgn*r*0.37,-r*0.06,r*0.17,0,7); c.fill();
      c.fillStyle='#17171f'; c.beginPath(); c.arc(sgn*r*0.37,-r*0.03,r*0.085,0,7); c.fill();
      c.fillStyle='rgba(255,255,255,.95)';
      c.beginPath(); c.arc(sgn*r*0.37-r*0.06,-r*0.12,r*0.06,0,7); c.fill();
    }
    // 실크햇 (살짝 기울어)
    c.save(); c.rotate(-0.12+sway*0.02);
    c.fillStyle='#1b1b22';
    c.fillRect(-r*0.95,-r*1.12, r*1.9, r*0.14);          // 챙
    c.fillRect(-r*0.58,-r*1.86, r*1.16, r*0.78);          // 통
    c.fillStyle='#b4243a'; c.fillRect(-r*0.58,-r*1.30, r*1.16, r*0.2);   // 띠
    c.restore();
    // 반짝임
    c.fillStyle='rgba(255,246,200,'+(0.55+0.45*Math.sin(t*5)).toFixed(2)+')';
    var sx=[-1.35,1.32,1.15,-1.18], sy=[-1.25,-1.45,0.62,0.78];
    for(var i=0;i<4;i++){
      var ss=r*(0.10+0.04*Math.sin(t*4+i));
      c.beginPath();
      c.moveTo(sx[i]*r, sy[i]*r-ss); c.lineTo(sx[i]*r+ss*0.4, sy[i]*r);
      c.lineTo(sx[i]*r, sy[i]*r+ss); c.lineTo(sx[i]*r-ss*0.4, sy[i]*r);
      c.closePath(); c.fill();
    }
    c.restore();
  }

  // ---- 사운드 (첫 터치 후) ----
  var AC=null, muted=false;
  function audioInit(){
    if(AC) return;
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      // iOS는 사용자가 누른 그 순간에 실제로 소리를 한 번 내보내야 오디오가 깨어난다(무음 버퍼)

  }
  function audioWake(){   // 터치·클릭 때마다 불러 준다(아이폰은 수시로 오디오를 잠근다)
    audioInit();
    if(AC && AC.state!=='running'){ try{ AC.resume(); }catch(e){} }
  }
  function beep(freq,dur){
    if(muted||!AC) return;   // '동작 줄이기'는 애니메이션 설정이지 소리와 무관하다
    try{ var o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=freq;
      g.gain.value=0.0001; o.connect(g); g.connect(AC.destination); var t=AC.currentTime;
      g.gain.exponentialRampToValueAtTime(0.14, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  }
  function meow(tier){ // 귀여운 "냐~옹" — 큰 고양이일수록 낮은 음
    if(muted||!AC) return;
    try{
      var base=920 - tier*52, t0=AC.currentTime;
      var o=AC.createOscillator(), g=AC.createGain(), f=AC.createBiquadFilter();
      o.type='triangle'; f.type='bandpass'; f.frequency.value=base*1.5; f.Q.value=3.5;
      o.connect(f); f.connect(g); g.connect(AC.destination);
      o.frequency.setValueAtTime(base*0.72, t0);
      o.frequency.exponentialRampToValueAtTime(base*1.3, t0+0.09);
      o.frequency.exponentialRampToValueAtTime(base*0.58, t0+0.3);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.16, t0+0.025);
      g.gain.setValueAtTime(0.14, t0+0.14);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.32);
      o.start(t0); o.stop(t0+0.35);
    }catch(e){}
  }
  function noteAt(freq,t,dur,type,vol){ // 지정 시각에 짧은 음 하나 (BGM·팡파르용)
    try{ var o=AC.createOscillator(), g=AC.createGain();

      o.connect(g); g.connect(AC.destination);

      g.gain.exponentialRampToValueAtTime(vol,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.start(t); o.stop(t+dur+0.03);
    }catch(e){}
  }
  function boom(){     // 쿵! — 저음 충격 + 노이즈 버스트
    if(muted||!AC) return;
    try{
      var t0=AC.currentTime, sr=AC.sampleRate, dur=0.9;
      var buf=AC.createBuffer(1, Math.floor(sr*dur), sr), ch=buf.getChannelData(0);
      for(var i=0;i<ch.length;i++){ var k=i/ch.length; ch[i]=(Math.random()*2-1)*Math.pow(1-k,2.6); }
      var src=AC.createBufferSource(); src.buffer=buf;
      var lp=AC.createBiquadFilter(); lp.type='lowpass';
      lp.frequency.setValueAtTime(1800,t0); lp.frequency.exponentialRampToValueAtTime(140,t0+dur);
      var g=AC.createGain(); g.gain.setValueAtTime(0.42,t0);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      src.connect(lp); lp.connect(g); g.connect(AC.destination); src.start(t0);
      var o=AC.createOscillator(), og=AC.createGain(); o.type='sine';

      o.connect(og); og.connect(AC.destination); o.start(t0); o.stop(t0+0.68);
    }catch(e){}
  }
  function fanfare(){ // 축하 아르페지오
    if(muted||!AC) return;
    var fs=[523,659,784,1047,1319], t0=AC.currentTime;
    for(var i=0;i<fs.length;i++) noteAt(fs[i], t0+i*0.085, 0.22, 'triangle', 0.14);

  function alarmCry(){ // 위험선 경고 — 다급한 "먀!먀!"

        var o=AC.createOscillator(), g=AC.createGain();
        o.type='triangle'; o.connect(g); g.connect(AC.destination);
        var s=t0+i*0.16;
        o.frequency.setValueAtTime(1150,s);
        o.frequency.exponentialRampToValueAtTime(680,s+0.11);
        g.gain.setValueAtTime(0.0001,s);
        g.gain.exponentialRampToValueAtTime(0.12,s+0.015);
        g.gain.exponentialRampToValueAtTime(0.0001,s+0.13);
        o.start(s); o.stop(s+0.15);
      }
    }catch(e){}

  // ---- BGM (웹오디오로 만든 잔잔한 칩튠 루프 — 🎵 버튼으로 켜고 끔) ----

  function bgmTick(){
    if(!AC||!bgmOn) return;
    var step=fever?0.175:0.21;   // 피버 중엔 살짝 빨라짐
    while(bgmNext < AC.currentTime+0.3){
      var m=BGM_MEL[bgmStep%BGM_MEL.length];
      if(m) noteAt(mf(m), bgmNext, 0.17, 'triangle', 0.034);
      if(bgmStep%4===0) noteAt(mf(BGM_BASS[(bgmStep>>2)%BGM_BASS.length]), bgmNext, 0.3, 'sine', 0.05);
      bgmNext+=step; bgmStep++;

  }

  function checkOver(dt){
    if(over){ dangerLevel=0; return; }
    var bodies=Composite.allBodies(world), d=0, now=performance.now();
    for(var i=0;i<bodies.length;i++){ var b=bodies[i]; if(!b.isCat) continue;
      var spd=Math.hypot(b.velocity.x,b.velocity.y);
      if(b.position.y - b.circleRadius < GY && spd<0.9 && (now-b.spawnStamp>600)){
        b.overT+=dt; if(b.overT>900){ endGame(); return; }
      } else b.overT=Math.max(0,b.overT-dt*1.5);
      if(b.overT>0) d=Math.max(d, b.overT/900);
      else if(spd<0.9 && b.position.y - b.circleRadius < GY+34 && (now-b.spawnStamp>600)) d=Math.max(d,0.18);
    }
    dangerLevel=d;
    if(d>0.2 && now-lastAlarm>1600){ lastAlarm=now; alarmCry(); }

  function render(){
    var nowR=performance.now();
    ctx.save(); ctx.setTransform(1,0,0,1,0,0);                  // 남는 여백까지 배경색으로 덮는다
    ctx.fillStyle='#f6dfc0'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.restore();

      ctx.fillStyle='rgba(235,70,60,'+(0.16*dangerLevel*pulse).toFixed(3)+')';

    } else {
      ctx.strokeStyle='rgba(239,125,87,.55)'; ctx.lineWidth=2;
    }
    ctx.setLineDash([7,7]);
    ctx.beginPath(); ctx.moveTo(6,GY); ctx.lineTo(W-6,GY); ctx.stroke(); ctx.setLineDash([]);
    // 고양이들
    var bodies=Composite.allBodies(world);
    for(var i=0;i<bodies.length;i++){ var b=bodies[i]; if(!b.isCat) continue;
      var s=1; if(b.pop>0){ s=1+0.22*b.pop; b.pop*=0.80; if(b.pop<0.02) b.pop=0; }
      // 그림자
      ctx.fillStyle='rgba(120,80,40,.12)'; ctx.beginPath(); ctx.ellipse(b.position.x, b.position.y+b.circleRadius*0.82, b.circleRadius*0.8, b.circleRadius*0.22,0,0,7); ctx.fill();
      ctx.save(); ctx.translate(b.position.x,b.position.y); ctx.scale(s,s); drawCat(ctx,0,0,b.circleRadius,b.tier,b.angle); ctx.restore();

      }

    // 들고 있는 다음 고양이(미리보기) + 가이드선
    if(!over){
      var r=TIERS[cur].r, px=Math.max(r+2,Math.min(W-r-2,dropX));

  // ---- 루프 ----
  var last=performance.now(), acc=0, STEP=1000/60;
  function loop(now){
    var dt=Math.min(100, now-last); last=now;
    if(!over){
      // 물리는 항상 1/60초 단위로만 돌린다 → 주사율·프레임 드랍과 무관하게 모든 기기에서 같은 속도
      acc+=dt;
      var steps=0;
      while(acc>=STEP && steps<5){ Engine.update(engine, STEP); acc-=STEP; steps++; }
      if(steps>=5) acc=0;   // 많이 밀렸으면 따라잡기를 포기(느려지느니 건너뛴다)
      processMerges();
      // 스폰 시각 기록
      var bodies=Composite.allBodies(world);
      for(var i=0;i<bodies.length;i++){ if(bodies[i].isCat && !bodies[i].spawnStamp) bodies[i].spawnStamp=now; }
      checkOver(dt);
    }
    var ts=dt/STEP;   // 120Hz에서 연출만 2배 빨라지지 않게 프레임 길이에 비례시킨다
    for(var p=particles.length-1;p>=0;p--){ var pt=particles[p]; pt.x+=pt.vx*ts; pt.y+=pt.vy*ts; pt.vy+=0.14*ts; pt.life-=0.03*ts; if(pt.life<=0) particles.splice(p,1); }
    for(var f=floaters.length-1;f>=0;f--){ var fl=floaters[f]; fl.t+=0.016*ts; fl.y-=0.5*ts; if(fl.t>=1) floaters.splice(f,1); }
    // 예약된 연쇄 폭발을 차례로 터뜨린다
    for(var pb=pendingBursts.length-1; pb>=0; pb--){
      var P=pendingBursts[pb]; P.wait-=ts;
      if(P.wait<=0){
        burst(P.x,P.y,P.col,P.r);
        if(P.r>50) shakeAmt=Math.min(24, shakeAmt+2);
        pendingBursts.splice(pb,1);
      }
    }
    for(var sv=shockwaves.length-1; sv>=0; sv--){
      shockwaves[sv].t+=0.042*ts;
      if(shockwaves[sv].t>1.15) shockwaves.splice(sv,1);
    }
    if(flashAmt>0.01) flashAmt*=Math.pow(0.86, ts); else flashAmt=0;
    if(combo && now>comboExpire) combo=0;
    if(fever && now>feverEnd){ fever=false; floaters.push({x:W/2,y:H*0.3,t:0,txt:'피버 종료!',big:false}); }
    if(shakeAmt>0.1) shakeAmt*=0.86; else shakeAmt=0;
    updateFeverBar(now);
    if(dirty && now-lastSave>2500){ lastSave=now; saveNow(); }
    render();
    requestAnimationFrame(loop);
  }

  // Supabase(PostgREST) — 익명 INSERT 전용. 한 판 = 한 행.
  function supabaseBackend(cfg){
    var base=cfg.url.replace(/\/+$/,'')+'/rest/v1/scores';
    function hdr(extra){
      var h={ apikey:cfg.key, Authorization:'Bearer '+cfg.key };
      if(extra) for(var k in extra) h[k]=extra[k];
      return h;
    }
    function toJson(res){ if(!res.ok) throw new Error('http '+res.status); return res.json(); }
    return {
      top:function(n){
        return fetch(base+'?select=id,name,score&order=score.desc&limit='+n, {headers:hdr()})
          .then(toJson).then(function(rows){
            return (rows||[]).map(function(r){
              return {id:String(r.id), name:String(r.name||'냥이'), score:Number(r.score)||0};
            });
          });
      },
      submit:function(name,score){
        return fetch(base, {method:'POST',
          headers:hdr({'Content-Type':'application/json', Prefer:'return=representation'}),
          body:JSON.stringify({name:name, score:score})})
          .then(toJson).then(function(rows){
            var id=(rows&&rows[0])?String(rows[0].id):''; rememberRow(id); return id;
          });
      },
      rankOf:function(score){
        // 나보다 높은 점수의 개수만 세기 — Content-Range 헤더로 총개수를 받는다
        return fetch(base+'?select=id&score=gt.'+encodeURIComponent(score),
            {headers:hdr({Prefer:'count=exact', Range:'0-0'})})
          .then(function(res){
            var n=parseInt(String(res.headers.get('content-range')||'').split('/')[1],10);
            return isFinite(n)? n+1 : 0;
          }).catch(function(){ return 0; });
      }
    };
  }
  // claude.ai 아티팩트 내장 DB — 사람당 한 행(최고 점수 갱신)
  function claudeBackend(db, uid){
    return {
      top:function(n){
        return db.collection('scores').orderBy('score','desc').limit(n).get().then(function(snap){
          return snap.docs.map(function(d){
            var v=d.data()||{};
            return {id:d.id, name:String(v.name||'냥이'), score:Number(v.score)||0};
          });
        });
      },
      submit:function(name,score){
        return db.doc('scores/'+uid).set({name:name, score:score, at:Date.now()})
          .then(function(){ return uid; });
      },
      rankOf:function(score){
        return db.collection('scores').where('score','>',score).limit(1000).get()
          .then(function(s){ return s.docs.length+1; }).catch(function(){ return 0; });
      }
    };
  }

  function registerScore(nameRaw, done){
    if(!RANK){ done(rankOffMsg); return; }
    var v=(nameRaw||'').trim().slice(0,12);
    if(!v){ done('이름을 입력해 주세요'); return; }
    nickname=v; try{ localStorage.setItem('nyang_nick',v); }catch(e){}
    $nick.value=v;
    var sc=best;
    if(!(sc>0)){ done('등록할 점수가 없어요'); return; }
    RANK.submit(v, sc)
      .then(function(){
        submittedBest=sc; try{ localStorage.setItem('nyang_sub', String(sc)); }catch(e){}
        return RANK.rankOf(sc);
      })
      .then(function(rk){ myRank=rk; refreshTop(); done(null, rk); })
      .catch(function(){ done('등록에 실패했어요 — 잠시 뒤 다시 해보세요'); });
  }
  function updateMyRankUI(){
    document.getElementById('rkMyBest').textContent=fmt(best);
    var $r=document.getElementById('rkMyRank');
    if(!RANK){ $r.textContent='랭킹 불가'; return; }
    if(!submittedBest){ $r.textContent='미등록'; return; }
    $r.textContent='순위 확인 중…';
    RANK.rankOf(submittedBest).then(function(rk){
      myRank=rk; $r.textContent = rk? (rk+'위') : '순위 확인 실패';
    });
  }
  function refreshTop(){
    if(!RANK){ rkStatus(rankOffMsg); return; }
    RANK.top(10).then(renderRank).catch(function(){ rkStatus('랭킹을 불러올 수 없어요'); });
  }
  // 게임오버 패널: 이름 입력 + 등록 버튼
  var $regBox=document.getElementById('regBox'), $regMsg=document.getElementById('regMsg'),
      $regBtn=document.getElementById('regBtn'), $overNick=document.getElementById('overNick');
  function regMsg(t,bad){ $regMsg.textContent=t||''; $regMsg.classList.toggle('bad',!!bad); }
  function onGameOverRank(){
    $regBtn.disabled=false; $regBtn.textContent='🏆 등록';
    $overNick.value=nickname; $overNick.disabled=false;
    if(!RANK){ $regBox.hidden=true; regMsg(rankOffMsg); return; }
    $regBox.hidden=false;
    if(submittedBest>0 && best<=submittedBest){   // 같은 점수를 또 올려 중복 기록이 쌓이는 것 방지
      $regBtn.disabled=true; $overNick.disabled=true;
      regMsg('이미 등록한 최고 점수예요 — 더 높은 점수를 내면 등록할 수 있어요!');
    } else regMsg('이름을 넣고 등록하면 랭킹에 올라가요!');
  }
  $regBtn.addEventListener('click', function(){
    $regBtn.disabled=true; regMsg('등록 중…');
    registerScore($overNick.value, function(err, rk){
      if(err){ regMsg(err,true); $regBtn.disabled=false; return; }
      $regBtn.textContent='✅ 등록 완료'; $overNick.disabled=true;
      regMsg('🎉 '+nickname+' — 현재 '+rk+'위!');
    });
  });
  $overNick.addEventListener('keydown', function(e){ if(e.key==='Enter') $regBtn.click(); });
  function renderRank(rows){
    var list=document.getElementById('rkList'); list.textContent='';
    for(var i=0;i<rows.length;i++){
      var r=rows[i], li=document.createElement('li');
      if(myRows.indexOf(String(r.id))>=0) li.className='me';
      var no=document.createElement('span'); no.className='no'; no.textContent=String(i+1);
      var nm=document.createElement('span'); nm.className='nm'; nm.textContent=r.name;
      var sc=document.createElement('span'); sc.className='sc'; sc.textContent=r.score.toLocaleString('en-US');
      li.appendChild(no); li.appendChild(nm); li.appendChild(sc); list.appendChild(li);
    }
    rkStatus(rows.length? '게임이 끝나면 이름을 넣어 등록하세요' : '아직 기록이 없어요 — 첫 주인공이 되어보세요!');
  }
  (function initRank(){
    if(SUPABASE.url && SUPABASE.key){            // 웹 배포판: 누구나 로그인 없이 등록
      RANK=supabaseBackend(SUPABASE);
      rankOffMsg='랭킹 서버에 연결할 수 없어요';
      if(over) onGameOverRank();
      return;
    }
    rankOffMsg='랭킹은 claude.ai에 로그인하면 등록돼요';   // 아티팩트판 폴백
    if(!(window.claude&&window.claude.use)){ rkStatus(rankOffMsg); return; }
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function(res){
      var db=res[0], u=res[1];
      if(!db||!u){ rkStatus(rankOffMsg); return; }
      return u.id().then(function(id){
        if(!id){ rkStatus(rankOffMsg); return; }
        RANK=claudeBackend(db,id); myRows=[String(id)];
        // 이미 등록한 기록이 있으면 불러와 '미등록' 표시를 막는다
        return db.doc('scores/'+id).get().then(function(d){
          var v=d&&d.exists?(d.data()||{}):null;
          if(v && Number(v.score)>0){
            submittedBest=Math.max(submittedBest, Number(v.score));
            if(!nickname && v.name){ nickname=String(v.name); $nick.value=nickname; }
          }
          if(over) onGameOverRank();   // db가 늦게 붙었는데 이미 게임오버면 등록칸을 다시 띄움
        }).catch(function(){});
      });
    }).catch(function(){ rkStatus(rankOffMsg); });
  })();
  document.getElementById('rankBtn').addEventListener('click', function(){
    document.getElementById('rankWrap').hidden=false;
    rkStatus('불러오는 중…'); refreshTop(); updateMyRankUI();
  });
  document.getElementById('rankClose').addEventListener('click', function(){ document.getElementById('rankWrap').hidden=true; });
  document.getElementById('rankWrap').addEventListener('click', function(e){ if(e.target===this) this.hidden=true; });

})();
</script>
