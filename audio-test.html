<h1>🔊 냥냥 머지 소리 진단</h1>
<p class="lead">위에서부터 차례로 눌러 보고, <b>어디서 처음 소리가 들렸는지</b> 알려줘.<br>
먼저 <b>폰 볼륨을 올리고</b> 시작해.</p>

<div class="box">
  <h2>1단계 · 가장 기본</h2>
  <p class="hint">웹 표준 오디오로 소리를 냅니다. 측면 무음 스위치 영향을 받습니다.</p>
  <button onclick="t1()">🔈 소리 내보기 (기본)</button>
  <div class="res" id="r1"></div>
</div>

<div class="box">
  <h2>2단계 · 무음 스위치 무시 시도</h2>
  <p class="hint">오디오를 '재생음'으로 올린 뒤 같은 소리를 냅니다. <b>이게 지금 게임에 넣은 방식</b>입니다.</p>
  <button onclick="t2()">🔊 소리 내보기 (세션 전환)</button>
  <div class="res" id="r2"></div>
</div>

<div class="box">
  <h2>3단계 · 음원 파일 재생</h2>
  <p class="hint">합성이 아니라 실제 음원 파일을 재생합니다. 이것도 안 들리면 폰 설정 문제입니다.</p>
  <button onclick="t3()" class="sec">🎵 음원 재생</button>
  <div class="res" id="r3"></div>
</div>

<script>
var AC=null;
function show(id, msg, ok){ var e=document.getElementById(id); e.textContent=msg; e.className='res '+(ok?'ok':'bad'); }
function mkAC(){
  if(AC) return AC;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  try{ var b=AC.createBuffer(1,1,22050),s=AC.createBufferSource(); s.buffer=b; s.connect(AC.destination); s.start(0); }catch(e){}
  return AC;
}
function beep(){
  var c=mkAC(); if(!c) return '오디오를 만들 수 없음';
  if(c.state!=='running'){ try{ c.resume(); }catch(e){} }
  try{
    var o=c.createOscillator(), g=c.createGain();
    o.type='sine'; o.frequency.value=660;
    g.gain.setValueAtTime(0.0001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.4,c.currentTime+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.5);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+0.55);
    return 'state=' + c.state;
  }catch(e){ return '오류: '+e.message; }
}
function t1(){ var r=beep(); show('r1','소리를 냈습니다 ('+r+') — 들렸나요?', true); info(); }
function toPlayback(){
  var done=[];
  try{ if(navigator.audioSession){ navigator.audioSession.type='playback'; done.push('audioSession=playback'); } else done.push('audioSession 미지원'); }catch(e){ done.push('audioSession 실패'); }
  try{ var s=document.getElementById('sil'); var p=s.play(); if(p&&p['catch']) p['catch'](function(){}); done.push('무음재생 시도'); }catch(e){ done.push('무음재생 실패'); }
  return done.join(' / ');
}
function t2(){ var a=toPlayback(); var r=beep(); show('r2', a+' → '+r+' — 들렸나요?', true); info(); }
function t3(){
  var el=document.getElementById('tone'); el.currentTime=0; el.volume=1;
  var p=el.play();
  if(p&&p['catch']) p['catch'](function(e){ show('r3','재생 거부됨: '+e.name, false); });
  show('r3','음원을 재생했습니다 — 들렸나요?', true); info();
}
function info(){
  var c=AC;
  var rows=[
    ['오디오 상태', c? c.state : '아직 안 만듦'],
    ['샘플레이트', c? c.sampleRate+' Hz' : '-'],
    ['audioSession 지원', navigator.audioSession? ('예 (type=' + (navigator.audioSession.type||'?') + ')') : '아니오'],
    ['화면', window.innerWidth+'x'+window.innerHeight+' @'+(window.devicePixelRatio||1)+'x'],
    ['동작 줄이기', (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)? '켜짐' : '꺼짐'],
    ['브라우저', navigator.userAgent]
  ];
  document.getElementById('info').innerHTML = rows.map(function(r){
    return '<tr><td>'+r[0]+'</td><td><code>'+String(r[1]).replace(/</g,'&lt;')+'</code></td></tr>';
  }).join('');
}
info();
</script>
